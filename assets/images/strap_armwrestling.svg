<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2538"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#cc0044"/>
      <stop offset="100%" stop-color="#880022"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8892b0"/>
      <stop offset="50%" stop-color="#ccd6f6"/>
      <stop offset="100%" stop-color="#495670"/>
    </linearGradient>
    <pattern id="nylonPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0,10 L 20,10 M 10,0 L 10,20" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#bgGlow)"/>
  <circle cx="300" cy="300" r="240" fill="none" stroke="rgba(0, 255, 136, 0.15)" stroke-width="2" stroke-dasharray="8 6"/>
  
  <!-- Strap loops -->
  <g transform="translate(300, 300) rotate(-25)">
    <!-- Main loop shadow -->
    <path d="M -160,-40 C -160,-120 160,-120 160,-40 C 160,80 -160,80 -160,-40 Z" fill="rgba(0,0,0,0.5)" transform="translate(10, 15)"/>
    <!-- Main red nylon strap -->
    <path d="M -160,-40 C -160,-120 160,-120 160,-40 C 160,80 -160,80 -160,-40 Z" fill="url(#strapGrad)" stroke="#ff3366" stroke-width="4"/>
    <path d="M -160,-40 C -160,-120 160,-120 160,-40 C 160,80 -160,80 -160,-40 Z" fill="url(#nylonPattern)"/>
    
    <!-- Heavy-duty reinforcement stitches -->
    <path d="M -130,-30 L 130,-30 M -130,20 L 130,20" stroke="#ffdd00" stroke-width="3" stroke-dasharray="10 6"/>
    <path d="M -130,-5 L 130,-5" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- Heavy buckle -->
    <rect x="-40" y="-80" width="80" height="40" rx="8" fill="url(#metalGrad)" stroke="#ffffff" stroke-width="3"/>
    <rect x="-25" y="-70" width="50" height="20" rx="4" fill="#0a0e17"/>
    
    <!-- Kodiak patch -->
    <rect x="-70" y="30" width="140" height="45" rx="6" fill="#111827" stroke="#00ff88" stroke-width="2"/>
    <text x="0" y="58" fill="#00ff88" font-family="'Rajdhani', sans-serif" font-weight="bold" font-size="20" text-anchor="middle" letter-spacing="3">KODIAK PRO</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="8" text-anchor="middle" letter-spacing="1">ARM-WRESTLING 500KG</text>
  </g>
  
  <!-- Technical Spec Watermark -->
  <text x="30" y="550" fill="rgba(0, 229, 255, 0.7)" font-family="monospace" font-size="14">KODIAK-STRAP // MILITARY NYLON // 500KG LOAD</text>
  <circle cx="540" cy="60" r="30" fill="rgba(0, 255, 136, 0.2)" stroke="#00ff88" stroke-width="2"/>
  <text x="540" y="65" fill="#00ff88" font-family="'Rajdhani', sans-serif" font-weight="bold" font-size="14" text-anchor="middle">500KG</text>
</svg>
